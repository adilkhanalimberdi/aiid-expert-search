# Деплой при каждом merge в master. Не запускается, пока в Settings → Variables нет DEPLOY_ENABLED=true
# и не заданы секреты (см. docs/deploy.md). Сторонних actions для SSH нет: только ssh/scp.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/lodestar' }}
      WEB_PORT: ${{ vars.WEB_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Префикс образов
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lodestar" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ бэкенда
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Образ фронта
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Доступ к серверу
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Выкатить на сервер
        env:
          REMOTE: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          ssh_opts="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          scp $ssh_opts compose.prod.yaml "$REMOTE:$DEPLOY_PATH/compose.prod.yaml"
          # Токен уходит по stdin, а не в аргументах: его не видно в списке процессов
          printf '%s' "$REGISTRY_TOKEN" | ssh $ssh_opts "$REMOTE" \
            "IMAGE_PREFIX='$IMAGE_PREFIX' TAG='$TAG' WEB_PORT='$WEB_PORT' REGISTRY_USER='$REGISTRY_USER' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f models/bge-m3/config.json || { echo "Нет модели в $DEPLOY_PATH/models/bge-m3, см. docs/deploy.md"; exit 1; }
          docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          export IMAGE_PREFIX TAG WEB_PORT
          docker compose -f compose.prod.yaml pull
          docker compose -f compose.prod.yaml up -d --remove-orphans
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/api/health" > /dev/null; then
              echo "Сервис отвечает (попытка $attempt)"; docker image prune -f > /dev/null; exit 0
            fi
            sleep 5
          done
          echo "Сервис не поднялся за 5 минут"; docker compose -f compose.prod.yaml logs --tail 50 backend; exit 1
          REMOTE_SCRIPT
