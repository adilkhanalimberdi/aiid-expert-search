# Продакшен-вариант: готовые образы из GHCR, модель томом с диска сервера.
# Запускает деплой (.github/workflows/deploy.yml), вручную: IMAGE_PREFIX=ghcr.io/<owner>/lodestar docker compose -f compose.prod.yaml up -d

services:
  backend:
    image: ${IMAGE_PREFIX}-backend:${TAG:-latest}
    environment:
      CACHE_DIR: state/cache
      FEEDBACK_DB: state/feedback.db
      UPLOADED_CSV: state/uploaded.csv
    volumes:
      - ./models:/app/models:ro
      - backend-state:/app/state
    # Бэкенд занимает ~2 ГБ в пике (bge-m3); лимит защищает остальные сервисы сервера
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX}-web:${TAG:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-state:
